<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUGLE-STREAM | Red Transmultiversal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0d0e12; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #landing-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, rgba(13,14,18,0.85) 0%, rgba(13,14,18,0.98) 100%),
                  url('https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=1400') center/cover no-repeat;
    }
    .welcome-box {
      text-align: center; max-width: 750px; padding: 40px;
      background: rgba(18, 19, 26, 0.85); border: 2px solid #e50914; border-radius: 16px;
      box-shadow: 0 0 35px rgba(229, 9, 20, 0.4);
    }
    .btn-welcome {
      background-color: #e50914; border: none; color: white; font-size: 1.5rem; font-weight: 800;
      padding: 15px 45px; border-radius: 50px; box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
    }
    .btn-welcome:hover { background-color: #ff1e27; transform: scale(1.08); color: white; }
  </style>
</head>
<body>
  <section id="landing-screen">
    <div class="welcome-box">
      <span class="badge bg-danger px-3 py-2 mb-3">ACCESO LIBRE MULTIVERSAL</span>
      <h1 class="display-2 fw-bold text-danger mb-2">BUGLE-STREAM</h1>
      <p class="fs-4 text-light-50 mb-4">La red oficial de transmisión de Spider-Man & Daily Bugle Corp.</p>
      <button class="btn btn-welcome text-uppercase" onclick="alert('Bienvenido al sistema BUGLE-STREAM')">¡BIENVENIDOS!</button>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
