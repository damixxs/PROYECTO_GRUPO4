<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUGLE-STREAM | Red Transmultiversal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <section id="landing-screen">
    <div class="welcome-box">
      <span class="badge bg-danger px-3 py-2 mb-3">ACCESO LIBRE MULTIVERSAL</span>
      <h1 class="display-2 fw-bold text-danger mb-2">BUGLE-STREAM</h1>
      <p class="fs-4 text-white-50 mb-4">La red oficial de transmisión de Spider-Man &amp; Daily Bugle Corp.</p>
      <button class="btn btn-welcome text-uppercase" onclick="enterCatalog()">¡BIENVENIDOS!</button>
    </div>
  </section>

    <div id="catalog-screen" style="display: none;">

    <!-- NAVBAR (feature/navbar-y-hero) -->

    <!-- HERO (feature/navbar-y-hero) -->

    <!-- GRID DE PELICULAS (feature/grid-peliculas-cards) -->
      <section class ="container py-5" id="catalogo">
        <h2 class="text-danger fw-bold mb-4">Catalogo Multiversal</h2>>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

        <div class="col movie-card" data-title="Spider-Man 2002">
          <div class="card h-100">
            <img src="img/poster-spider-man-2002.jpg" class="card-img-top" alt="Spider-Man 2002">
            <div class="card-body">
              <h5 class="card-title">Spider-Man (2002)</h5>
              <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modal-spider-man-2002">Ver</button>
            </div>
          </div>
        </div>

        <div class="col movie-card" data-title="The Amazing Spider-Man">
          <div class="card h-100">
            <img src="img/poster-the-amazing-spider-man.jpg" class="card-img-top" alt="The Amazing Spider-Man">
            <div class="card-body">
              <h5 class="card-title">The Amazing Spider-Man</h5>
              <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modal-the-amazing-spider-man">Ver</button>
            </div>
          </div>
        </div>

        <div class="col movie-card" data-title="Spider-Man Homecoming">
          <div class="card h-100">
            <img src="img/poster-spider-man-homecoming.jpg" class="card-img-top" alt="Spider-Man Homecoming">
            <div class="card-body">
              <h5 class="card-title">Spider-Man: Homecoming</h5>
              <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modal-spider-man-homecoming">Ver</button>
            </div>
          </div>
        </div>

        <div class="col movie-card" data-title="Spider-Man No Way Home">
          <div class="card h-100">
            <img src="img/poster-spider-man-no-way-home.jpg" class="card-img-top" alt="Spider-Man No Way Home">
            <div class="card-body">
              <h5 class="card-title">Spider-Man: No Way Home</h5>
              <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modal-spider-man-no-way-home">Ver</button>
            </div>
          </div>
        </div>

        <div class="col movie-card" data-title="Into the Spider-Verse">
          <div class="card h-100">
            <img src="img/poster-into-the-spider-verse.jpg" class="card-img-top" alt="Into the Spider-Verse">
            <div class="card-body">
              <h5 class="card-title">Into the Spider-Verse</h5>
              <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modal-into-the-spider-verse">Ver</button>
            </div>
          </div>
        </div>

        <div class="col movie-card" data-title="Across the Spider-Verse">
          <div class="card h-100">
            <img src="img/poster-across-the-spider-verse.jpg" class="card-img-top" alt="Across the Spider-Verse">
            <div class="card-body">
              <h5 class="card-title">Across the Spider-Verse</h5>
              <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modal-across-the-spider-verse">Ver</button>
            </div>
          </div>
        </div>

      </div>

      <p id="sin-resultados" class="text-center d-none mt-4">No se encontraron películas.</p>
    </section>
    <!-- MODALS DEL REPRODUCTOR (feature/reproductor-google-drive) -->

    <!-- MULTIMEDIA EXTRA (feature/seccion-multimedia-extra) -->

    <!-- FOOTER (feature/estilos-spidey-custom) -->

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
